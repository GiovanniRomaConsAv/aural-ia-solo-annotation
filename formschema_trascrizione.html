<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formschema — trascrizione</title>
<style>
:root{
  --ink:#14140F; --hair:#C9C6BC; --paper:#FAF9F5;
  --blu:#1F4E79; --ocra:#A8741A; --deriv:#3E6B4F; --sel:#E8EDF3;
  --display:'Arial Narrow','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);padding:16px}
input,select,button{font-family:inherit;color:inherit}
input,select{background:transparent;border:1px solid var(--hair);padding:4px 6px}
input.mono{font-family:var(--mono)}
button{cursor:pointer;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blu);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.18em;opacity:.6}
h1{font-size:26px;font-weight:700;letter-spacing:.08em;margin:0}
.field{display:flex;flex-direction:column;font-size:11px;letter-spacing:.16em;opacity:.75}
.field input{margin-top:2px;font-size:15px;font-family:var(--mono)}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.actions button{border:1px solid var(--ink);padding:8px 12px}
.actions button.primary{background:var(--blu);color:#fff;border-color:var(--blu)}
.linkbtn{border:none;text-decoration:underline;opacity:.7;font-size:11px;letter-spacing:.16em;padding:0}
#saveMsg{color:var(--deriv);font-size:11px;min-width:110px}
.sezioni{display:flex;gap:8px;min-width:max-content;margin-bottom:8px}
.sez{border:1px solid var(--hair);padding:8px;min-width:170px}
.sezhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.boxL{border:2px solid var(--ink);padding:0 7px;font-size:18px;font-weight:700}
.sezcalc{font-family:var(--mono);font-size:11px;color:var(--deriv)}
.sez input{width:100%;margin-top:6px;font-size:11px}
.sez .nd{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:14px;margin-top:0}
.sez .nd input{width:44px;margin:0;padding:2px 4px}
.sez .nd input.dur{width:60px}
.scroll{overflow-x:auto}
.status{font-family:var(--mono);font-size:12px;margin:6px 0 12px}
.status .sep{opacity:.3;margin:0 8px}
.ok{color:var(--deriv)} .warn{color:var(--ocra)}
.grid{border:1px solid var(--ink)}
.gridinner{min-width:max-content}
.row{display:flex}
.lbl{width:170px;flex:none;border-right:1px solid var(--hair);padding:4px 8px}
.lbl .g{font-size:12px;font-weight:700;letter-spacing:.04em}
.lbl .s{font-size:9px;opacity:.5;letter-spacing:.08em}
.lbl .r{font-size:12px;opacity:.85}
.hcell{width:30px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);cursor:pointer;padding:0}
.hcell.first{border-left:2px solid var(--ink)}
.hcell .l{font-size:9px;opacity:.45;height:11px}
.hcell.sel{background:var(--sel);font-weight:700}
.cell{width:30px;height:34px;flex:none;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);border-top:none;border-right:none;text-align:center;font-family:var(--mono);font-size:13px;color:transparent;padding:0;position:relative}
.cell.first{border-left:2px solid var(--ink)}
.cell.on{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.cell.bad{box-shadow:inset 0 0 0 2px var(--ocra);background:#F6EBD6}
.cell.sel:not(.on){background:#F0F2F5}
.cell .bar{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:var(--blu)}
.tcell{width:30px;height:32px;flex:none;border-left:1px solid var(--hair);position:relative}
.tcell.first{border-left:2px solid var(--ink)}
.tin{position:absolute;left:-28px;top:4px;width:56px;text-align:center;font-family:var(--mono);font-size:12px;padding:2px;background:var(--paper)}
.tin::placeholder{opacity:.35}
.testinfo{font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--deriv);line-height:1.7}
.testinfo .none{opacity:.45;color:var(--ink)}
.cell .vf{position:absolute;top:1px;right:1px;width:5px;height:5px;background:var(--ocra);border-radius:50%}
.cell.om{box-shadow:inset 0 0 0 2px var(--blu)}
.advrow{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;align-items:center;font-size:11px}
.advrow label{display:flex;align-items:center;gap:3px;opacity:.8}
.advrow select,.advrow input{font-family:var(--mono);font-size:11px;padding:2px 4px}
.advrow .du{width:52px}
.warnbox{color:var(--ocra)}
.ev{margin-top:16px;border:1px solid var(--ink);padding:12px}
.ev .cyc{border:1px solid var(--hair);padding:8px;margin-bottom:8px}
.ev .cychead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ev .badgeL{border:2px solid var(--ink);padding:0 7px;font-size:15px;font-weight:700}
.chip{border:1px solid var(--hair);padding:3px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;background:#fff;position:relative}
.chip.warnf{border-color:var(--ocra)}
.chip .x{margin-left:6px;opacity:.5}
.addchip{border:1px dashed var(--ink);padding:3px 10px;font-size:11px;cursor:pointer;opacity:.75}
.evcard{border:1px solid var(--blu);padding:10px;margin-top:8px;background:#fff}
.evgrid{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.evgrid label{display:flex;flex-direction:column;font-size:10px;letter-spacing:.1em;opacity:.75;gap:2px}
.evgrid select,.evgrid input{font-family:var(--mono);font-size:12px;padding:3px 5px}
.evfull{grid-column:1/-1}
.carriers{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}
.carriers .c{border:1px solid var(--hair);padding:2px 7px;font-family:var(--mono);font-size:10px;cursor:pointer;background:#fff}
.carriers .c.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.evactions{display:flex;gap:8px;margin-top:8px}
.evactions button{border:1px solid var(--ink);padding:4px 12px;font-size:11px}
.evactions .del{color:var(--ocra);border-color:var(--ocra);margin-left:auto}
.panel{margin-top:16px;border:1px solid var(--ink);padding:12px}
.panelhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:12px}
.panelhead .t{font-size:19px;font-weight:700;letter-spacing:.06em}
.panelhead .m{font-family:var(--mono);font-size:12px;color:var(--deriv)}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{border:1px solid var(--hair);padding:4px 12px}
.op3grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.op3{border:1px solid var(--hair);padding:8px}
.op3 .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.op3 .h .n{font-size:12px;font-weight:700;letter-spacing:.04em}
.toggle{border:1px solid var(--ink);font-size:11px;padding:4px 8px}
.toggle.on{background:var(--ink);color:var(--paper)}
.sov{margin-left:auto;font-size:11px;opacity:.75}
.sov input{width:48px;margin-left:4px;font-family:var(--mono)}
.env{width:100%;font-family:var(--mono);font-size:13px;padding:8px}
.env.bad{border-color:var(--ocra)}
.envrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.envinfo{font-family:var(--mono);font-size:11px}
.hint{margin-top:12px;font-size:11px;opacity:.6;line-height:1.6}
.diag{margin-top:16px;border:1px solid var(--hair);padding:12px}
.diag.has{border-color:var(--ocra)}
.diag .t{font-size:11px;letter-spacing:.18em;margin-bottom:8px}
.diag ul{margin:0;padding-left:16px;font-family:var(--mono);font-size:11px;max-height:170px;overflow-y:auto}
.diag li{margin-bottom:2px}
.cards{margin-top:16px;border:1px solid var(--hair);padding:12px}
.cards table{font-family:var(--mono);font-size:11px;border-collapse:collapse}
.cards th{text-align:left;opacity:.6;padding:0 16px 4px 0;font-weight:400}
.cards td{padding:4px 16px 4px 0;border-top:1px solid var(--hair)}
#scan{width:100%;border:1px solid var(--hair);margin-top:8px}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.cell,.tcell{transition:box-shadow .08s}}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="eyebrow">TRASCRIZIONE · build alpha-003</div>
    <h1>FORMSCHEMA VERSION</h1>
  </div>
  <select id="versione" style="font-size:24px;font-weight:700;border-width:2px;border-color:var(--ink);padding:4px 8px"></select>
  <label class="field" title="Durata totale stampata sul foglio. Accetta 639.8 oppure 10'39,8 &mdash; serve solo come controllo contro la somma delle sezioni.">DURATA TOTALE<input id="dauer" class="mono" style="width:110px" placeholder="10'39,8"></label>
  <label class="field" title="Numero del paragrafo del manuale di Stockhausen a cui rimanda la testata: e' la chiave che collega l'annotazione al chunk giusto.">PARAGRAFO MANUALE<input id="rifv" class="mono" style="width:96px" placeholder="1_s"></label>
  <div class="actions">
    <span id="saveMsg"></span>
    <button id="btnSave">Salva lavoro</button>
    <button id="btnLoad">Riprendi lavoro</button>
    <button id="btnReset" style="border-color:var(--ocra);color:var(--ocra)">Reset</button>
    <button id="btnExport" class="primary">Esporta JSON</button>
  </div>
</div>

<div style="margin-bottom:16px">
  <button class="linkbtn" id="btnScan">MOSTRA SCANSIONE</button>
  <button class="linkbtn" id="btnImg" style="margin-left:12px">CARICA IMMAGINE</button>
  <img id="scan" class="hide" alt="">
</div>

<div class="scroll"><div class="sezioni" id="sezioni"></div></div>
<div class="status" id="status"></div>

<div class="grid scroll"><div class="gridinner" id="grid"></div></div>
<div class="testinfo" id="testinfo"></div>

<div class="panel" id="panel"></div>
<div class="ev" id="ev"></div>
<div class="diag" id="diag"></div>
<div class="cards">
  <button class="linkbtn" id="btnCards" style="color:var(--deriv)">+ SCHEDE OPERATORE — CALCOLATE, NON DA TRASCRIVERE</button>
  <div id="cardsBody" class="hide" style="margin-top:12px;overflow-x:auto"></div>
</div>

<input type="file" id="fileWork" accept=".json" class="hide">
<input type="file" id="fileImg" accept="image/*" class="hide">

function scaleMatch(durStr,approx){
  const v=parseFloat(String(durStr||"").replace(",",".")); if(isNaN(v)) return null;
  const tol=approx?1.0:0.35; let best=null;
  st.sezioni.forEach(sz=>{const d=parseFloat(sz.dur)||0; if(!d)return; const diff=Math.abs(d-v);
    if(diff<=tol&&(!best||diff<best.diff)) best={lettera:sz.lettera,dur:d,diff};});
  return best;
}
function scaleInfoHtml(k,c){
  if(!c.dur||String(c.dur).trim()==="") return "";
  const v=parseFloat(String(c.dur).replace(",",".")); if(isNaN(v)) return '<span class="warnbox">durata n/d</span>';
  const pd=mappa().celle[sel].dur||0;
  const off=parseFloat(String(c.off||"").replace(",",".")); const o=isNaN(off)?0:off;
  const m=scaleMatch(c.dur,c.approx);
  let phase="";
  if(pd){ const a=Math.round(o/pd*100), b=Math.round((o+v)/pd*100);
    phase = o>0 ? (a+"\u2192"+b+"% periodo") : (b+"% periodo"); }
  const scaleTxt = m?'<span style="color:var(--deriv)">= sez '+m.lettera+'</span>'
                    :'<span style="color:var(--ocra)">fuori scala</span>';
  return (phase?'<span style="opacity:.7">'+phase+'</span> \u00B7 ':"")+scaleTxt;
}

/* ---------- envelope ---------- */
function parseEnv(raw){
  const s=(raw||"").trim();
  if(!s) return {ok:true,empty:true,pairs:[],sum:0};
  const t=s.replace(/,/g," ").split(/\s+/).filter(Boolean);
  if(t.length%2!==0) return {ok:false,msg:"numero di token dispari \u2014 servono coppie valore tempo"};
  const pairs=[];
  for(let i=0;i<t.length;i+=2){
    const v=parseFloat(t[i]), ms=parseFloat(t[i+1]);
    if(isNaN(v)||isNaN(ms)) return {ok:false,msg:"token non numerico"};
    if(v<0||v>1) return {ok:false,msg:"ampiezza "+v+" fuori dal range 0\u20131"};
    if(ms<0) return {ok:false,msg:"tempo negativo"};
    pairs.push([v,ms]);
  }
  if(pairs[0][1]!==0) return {ok:false,msg:"il primo tempo deve essere 0"};
  return {ok:true,empty:false,pairs,sum:pairs.reduce((a,p)=>a+p[1],0)};
}
function parseGate(raw,periodDur){
  const s=(raw||"").trim();
  if(!s) return {ok:true,empty:true,segs:[]};
  const parts=s.split(";").map(x=>x.trim()).filter(Boolean);
  const segs=[];
  for(const part of parts){
    const bits=part.split("-").map(x=>x.trim());
    if(bits.length!==2) return {ok:false,msg:"segmento '"+part+"': usa il formato inizio-durata"};
    const st_=parseFloat(bits[0].replace(",",".")), du_=parseFloat(bits[1].replace(",","."));
    if(isNaN(st_)||isNaN(du_)) return {ok:false,msg:"segmento '"+part+"': valori non numerici"};
    if(st_<0) return {ok:false,msg:"segmento '"+part+"': inizio negativo"};
    if(du_<=0) return {ok:false,msg:"segmento '"+part+"': durata deve essere positiva"};
    segs.push({start:st_,dur:du_,end:st_+du_});
  }
  segs.sort((a,b)=>a.start-b.start);
  for(let i=0;i<segs.length;i++){
    if(periodDur&&segs[i].end>periodDur+0.1) return {ok:false,msg:"segmento "+(i+1)+" oltre la fine del periodo ("+periodDur+" s)"};
    if(i>0&&segs[i].start<segs[i-1].end-0.05) return {ok:false,msg:"segmenti "+i+" e "+(i+1)+" si sovrappongono"};
  }
  return {ok:true,empty:false,segs};
}
function gateCase(g){ return g.empty?1:(g.segs.length===1?2:3); }
function gateInfoHtml(k,c,periodDur){
  const g=parseGate(c.gate,periodDur);
  if(!g.ok) return '<span class="warnbox">'+g.msg+'</span>';
  if(g.empty) return '<span style="opacity:.6">caso 1 \u00B7 intero periodo, nessun offset</span>';
  if(g.segs.length===1){
    const s=g.segs[0], tail=periodDur?Math.max(0,+(periodDur-s.end).toFixed(2)):null;
    return '<span class="ok">caso 2 \u00B7 ritardo '+s.start+'s'+(tail!==null?' \u00B7 anticipo '+tail+'s':'')+'</span>';
  }
  return '<span class="ok">caso 3 \u00B7 '+g.segs.length+' segmenti: '+g.segs.map(s=>s.start+'\u2192'+s.end.toFixed(2)+'s').join(", ")+'</span>';
}
function envForma(p){
  if(!p||!p.length) return "\u2014";
  const v=p.map(x=>x[0]);
  if(v.every(x=>x===v[0])) return v[0]===0?"chiuso piatto":"piatto";
  let su=false,giu=false;
  for(let i=1;i<v.length;i++){if(v[i]>v[i-1])su=true;if(v[i]<v[i-1])giu=true;}
  if(su&&!giu) return "fade_in";
  if(giu&&!su) return "fade_out";
  const imax=v.indexOf(Math.max.apply(null,v)), imin=v.indexOf(Math.min.apply(null,v));
  if(imax>0&&imax<v.length-1) return "fade_in_out";
  if(imin>0&&imin<v.length-1) return "fade_out_in";
  return "composito";
}
function envSvg(pairs,durMs){
  const W=124,H=42,pad=4;
  if(!pairs||!pairs.length) return '<svg width="'+W+'" height="'+H+'"><rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="var(--hair)"/></svg>';
  let tot=Math.max(durMs||0,pairs.reduce((a,p)=>a+p[1],0),1), t=0, pts=[];
  pairs.forEach(p=>{t+=p[1];pts.push([pad+(t/tot)*(W-2*pad), H-pad-p[0]*(H-2*pad)]);});
  const last=pts[pts.length-1];
  let dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2" fill="var(--ink)"/>').join("");
  return '<svg width="'+W+'" height="'+H+'">'
   +'<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="var(--hair)"/>'
   +'<polyline points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" stroke="var(--ink)" stroke-width="1.5"/>'
   +'<line x1="'+last[0].toFixed(1)+'" y1="'+last[1].toFixed(1)+'" x2="'+(W-pad)+'" y2="'+last[1].toFixed(1)+'" stroke="var(--blu)" stroke-width="1.5" stroke-dasharray="3 2"/>'
   +dots+'</svg>';
}

/* ---------- derivati ---------- */
function mappa(){
  const out=[];
  st.sezioni.forEach(s=>{const n=parseInt(s.n,10)||0;
    for(let i=0;i<n;i++) out.push({lettera:s.lettera,nella:i+1,dur:parseFloat(s.dur)||0,primo:i===0});});
  const tot=out.length;
  while(out.length<51) out.push({lettera:"?",nella:0,dur:0,primo:false});
  return {celle:out.slice(0,51),totale:tot};
}
function sommaDurate(){return st.sezioni.reduce((a,s)=>a+(parseInt(s.n,10)||0)*(parseFloat(s.dur)||0),0)}
function dauerNum(){
  const s=String(st.dauer||"").replace(",",".").trim();
  if(!s) return NaN;
  const m=s.match(/^(\d+)\s*['\u2019]\s*([\d.]+)/);
  if(m) return parseInt(m[1],10)*60+parseFloat(m[2]);
  return parseFloat(s);
}

function cards(){
  const M=mappa().celle;
  return ROWS.map(r=>{
    const serie=st.periodi.map(p=>p[r.key]);
    const attivi=serie.filter(c=>c.on).length;
    const perfs=serie.map((c,i)=>({c,i})).filter(o=>o.c.on&&o.c.perf!==""&&r.op!==3&&semEff(o.i,r.key)==="PERFORATION").map(o=>parseInt(o.c.perf,10)||0);
    const per={};
    M.forEach((m,i)=>{per[m.lettera]=(per[m.lettera]||0)+(serie[i].on?1:0)});
    const L=LETTERE.filter(x=>per[x]!==undefined);
    const piu=L.slice().sort((a,b)=>per[b]-per[a])[0]||"\u2014";
    const meno=L.slice().sort((a,b)=>per[a]-per[b])[0]||"\u2014";
    let mo=0,mf=0,co=0,cf=0;
    serie.forEach(c=>{if(c.on){co++;cf=0}else{cf++;co=0} mo=Math.max(mo,co); mf=Math.max(mf,cf);});
    const tot=perfs.reduce((a,b)=>a+b,0);
    return {operatore:r.op,canale:r.ch,riga:r.r,
      periodi_attivi_totali:attivi, periodi_inattivi_totali:51-attivi,
      perforazioni_totali:r.op===3?null:tot,
      perforazioni_media_per_periodo:(r.op===3||!perfs.length)?null:+(tot/perfs.length).toFixed(2),
      perforazioni_massimo:(r.op===3||!perfs.length)?null:Math.max.apply(null,perfs),
      perforazioni_minimo:(r.op===3||!perfs.length)?null:Math.min.apply(null,perfs),
      sezione_piu_attiva:piu, sezione_meno_attiva:meno,
      periodi_consecutivi_attivi_max:mo, periodi_consecutivi_inattivi_max:mf};
  });
}

function problemi(){
  const out=[], M=mappa(), sd=sommaDurate(), dn=dauerNum();
  if(M.totale!==51) out.push("I periodi delle sezioni sommano "+M.totale+", non 51.");
  if(st.dauer&&!isNaN(dn)&&Math.abs(sd-dn)>=0.15)
    out.push("Le durate di sezione sommano "+sd.toFixed(1)+" s ma DAUER dice "+st.dauer+".");
  CONFINI.forEach(L=>{
    const raw=st.testine[L];
    if(raw!==undefined&&String(raw).trim()!==""&&isNaN(parseFloat(String(raw).replace(",","."))))
      out.push("Cambio testina "+L+": il ritardo non \u00E8 un numero.");
  });
  st.periodi.forEach((p,i)=>{
    ["op1L","op1R","op2L","op2R"].forEach(k=>{
      const c=p[k];
      if(c.on&&c.perf!==""&&semEff(i,k)==="PERFORATION"&&(parseInt(c.perf,10)||0)>13)
        out.push("P"+(i+1)+" "+k+": "+c.perf+" perforazioni, oltre il massimo censito di 13 \u2014 verifica.");
      const dv=parseFloat(String(c.dur||"").replace(",",".")), pd=M.celle[i].dur||0;
      const ov=parseFloat(String(c.off||"").replace(",",".")), o=isNaN(ov)?0:ov;
      if(!isNaN(dv)&&pd&&(o+dv)>pd+0.1)
        out.push("P"+(i+1)+" "+k+": apertura ("+(o>0?"inizio "+o+"s + ":"")+dv+" s) oltre la fine del periodo ("+pd+" s).");
    });
  });
  st.periodi.forEach((p,i)=>{
    ["op3L","op3R"].forEach(k=>{
      const c=p[k], pd=M.celle[i].dur||0, ge=parseGate(c.gate,pd);
      if(!c.on&&c.gate.trim()) out.push("P"+(i+1)+" "+k+": chiuso ma segmenti apertura compilati.");
      if(c.gate.trim()&&!ge.ok) out.push("P"+(i+1)+" "+k+": "+ge.msg+".");
    });
  });
  st.periodi.forEach((p,i)=>{
    ["op3L","op3R"].forEach(k=>{
      const c=p[k], pe=parseEnv(c.env);
      if(!c.on&&c.env.trim()) out.push("P"+(i+1)+" "+k+": fader chiuso ma envelope compilato.");
      if(c.env.trim()&&!pe.ok) out.push("P"+(i+1)+" "+k+": "+pe.msg+".");
      if(pe.ok&&!pe.empty){
        const d=(M.celle[i].dur||0)*1000;
        if(d&&pe.sum>d+1) out.push("P"+(i+1)+" "+k+": l'envelope dura "+pe.sum+" ms, il periodo "+Math.round(d)+" ms.");
      }
    });
  });
  return out;
}

function paintCell(b,i,r){
  const M=mappa().celle, c=st.periodi[i][r.key];
  let cls="cell"+(M[i].primo?" first":"");
  if(c.on) cls+=" on";
  if(sel===i) cls+=" sel";
  let bad=false;
  if(r.op===3&&c.env.trim()&&!parseEnv(c.env).ok){cls+=" bad";bad=true;}
  const om=(r.op!==3&&c.on&&semEff(i,r.key)==="OMISSION");
  if(om) cls+=" om";
  b.className=cls;
  const val=r.op===3?(c.sovrapp||""):(c.perf||"");
  const pe=r.op===3?parseEnv(c.env):null;
  b.innerHTML=val
    +((r.op===3&&c.on&&c.env.trim()&&pe.ok&&!bad)?'<span class="bar"></span>':"")
    +(c.verify?'<span class="vf"></span>':"");
  b.title=(r.op===3&&c.on)?("stratif "+(c.sovrapp||0)+" \u00B7 "+(c.env||"envelope vuoto"))
    :(om?"OMISSION (numeri = elementi da omettere)":"");
}
function testinaInfo(L){
  const raw=st.testine[L];
  if(raw===undefined||String(raw).trim()==="") return null;
  const r=parseFloat(String(raw).replace(",","."));
  if(isNaN(r)) return {err:true};
  const idx=st.sezioni.findIndex(s=>s.lettera===L);
  let pPrima=0, tPrima=0;
  for(let i=0;i<idx;i++){
    const n=parseInt(st.sezioni[i].n,10)||0;
    pPrima+=n; tPrima+=n*(parseFloat(st.sezioni[i].dur)||0);
  }
  const dQui=parseFloat(st.sezioni[idx].dur)||0;
  const dPrec=idx>0?(parseFloat(st.sezioni[idx-1].dur)||0):dQui;
  let periodo, frazione;
  if(r>=0){
    const d=dQui||1, k=Math.floor(r/d);
    periodo=pPrima+1+k; frazione=(r-k*d)/d;
  } else {
    const d=dPrec||1, k=Math.ceil(-r/d);
    periodo=pPrima-k+1; frazione=1-((-r)-(k-1)*d)/d;
  }
  return {r, periodo, frazione, assoluto:tPrima+r, separatore:(idx>0?st.sezioni[idx-1].lettera:"")+"|"+L};
}

      +" al "+Math.round(inf.frazione*100)+"% \u00B7 assoluto "+inf.assoluto.toFixed(1)+" s");
  });

  ROWS.forEach(r=>{for(let i=0;i<51;i++){

}

function toggleOn(i,k){
  const c=st.periodi[i][k];
  if(c.on){c.on=false;c.perf="";c.sovrapp="";c.env="";}
  else c.on=true;
  afterEdit(i,k);
}
function afterEdit(i,k){
  const r=ROWS.find(x=>x.key===k);
  const b=document.querySelector('[data-cell="'+i+"-"+k+'"]');
  if(b) paintCell(b,i,r);
  renderDiag(); renderCards(); save();
}

function onKey(e,i,k,ri){
  const key=e.key, c=st.periodi[i][k], f=k.indexOf("op3")===0?"sovrapp":"perf";
  if(/^[0-9]$/.test(key)){
    e.preventDefault();
    const cur=String(c[f]||"");
    c[f]=cur.length>=2?key:cur+key; c.on=true;
    afterEdit(i,k); renderPanel(); return;
  }
  if(key===" "){e.preventDefault();toggleOn(i,k);renderPanel();return;}
  if(key==="Backspace"||key==="Delete"){
    e.preventDefault();
    if(c[f]) c[f]="";
    else {c.on=false;c.env="";}
    afterEdit(i,k); renderPanel(); return;
  }
  const mv=(di,dr)=>{
    e.preventDefault();
    const ni=Math.min(50,Math.max(0,i+di)), nr=Math.min(ROWS.length-1,Math.max(0,ri+dr));
    const el=document.querySelector('[data-cell="'+ni+"-"+ROWS[nr].key+'"]');
    if(el) el.focus();
  };
  if(key==="ArrowRight") mv(1,0);
  if(key==="ArrowLeft") mv(-1,0);
  if(key==="ArrowDown") mv(0,1);
  if(key==="ArrowUp") mv(0,-1);
}

function wireCard(){
  const host=document.getElementById("ev"), e=st.eventi_op3[evSel]; if(!e) return;
  host.querySelectorAll("[data-e]").forEach(inp=>{
    const f=inp.dataset.e, ev=inp.type==="checkbox"?"onchange":"oninput";
    inp[ev]=()=>{
      if(inp.type==="checkbox") e[f]=inp.checked;
      else if(f==="count"||f==="GROUP_ID"||f==="DURATION_S"){
        const v=inp.value.replace(/[^0-9.]/g,""); e[f]=v===""?(f==="count"?null:""):(f==="count"?parseInt(v,10):v); }
      else e[f]=inp.value;
      if(f==="indeterminate"&&inp.checked) e.count=null;
      if(f==="indeterminate"||f==="ACTION_CLASS"){renderEventi();return;}
      save();
      const chip=host.querySelector('[data-open="'+evSel+'"]'); if(chip&&(f==="count"||f==="SPEED_PROFILE"))renderEventi();
    };
  });
  host.querySelectorAll("[data-carrier]").forEach(ch=>ch.onclick=()=>{
    const x=ch.dataset.carrier, arr=e.NOTATION_CARRIER||(e.NOTATION_CARRIER=[]);
    const j=arr.indexOf(x); if(j>=0)arr.splice(j,1); else arr.push(x);
    ch.classList.toggle("on"); save();
  });
  const cl=host.querySelector("[data-close]"); if(cl)cl.onclick=()=>{evSel=null;renderEventi();};
}

function buildJson(){
  const M=mappa().celle, dn=dauerNum();
  return {
    formschema_version:{versione:st.versione,durata_totale_secondi:isNaN(dn)?null:dn,
      numero_periodi_totali:51,riferimento_istruzione:st.rif_versione},
    sezioni:st.sezioni.map(s=>({lettera_sezione:s.lettera,
      numero_periodi:parseInt(s.n,10)||null,
      durata_singolo_periodo_secondi:parseFloat(s.dur)||null,
      durata_totale_secondi:+(((parseInt(s.n,10)||0)*(parseFloat(s.dur)||0)).toFixed(2)),
      riferimento_istruzione:s.rif})),
    periodi:st.periodi.map((p,i)=>{
      const m=M[i], row={numero_progressivo_assoluto:i+1,sezione:m.lettera,
        numero_progressivo_nella_sezione:m.nella,durata_secondi:m.dur||null,is_electronic_rest:i===0};
      ROWS.forEach(r=>{
        const c=p[r.key], b="op_"+r.op+"_"+r.ch;
        row[b+"_on"]=!!c.on;
        const durS=c.dur===""||c.dur===undefined?null:(parseFloat(String(c.dur).replace(",","."))||null);
        if(r.op===3){
          row[b+"_sovrapposizioni"]=c.on?(parseInt(c.sovrapp,10)||0):0;
          row[b+"_envelope"]=c.on?(c.env||"").trim():"";
          const pe=parseEnv(c.env);
          row[b+"_forma_derivata"]=(c.on&&pe.ok&&!pe.empty)?envForma(pe.pairs):"none";
          const ge=c.on?parseGate(c.gate,m.dur):{ok:true,empty:true,segs:[]};
          row[b+"_gate_case"]=(ge.ok&&c.on)?gateCase(ge):null;
          row[b+"_gate_segments"]=(ge.ok&&!ge.empty)?ge.segs.map(s=>({start_s:s.start,dur_s:s.dur,end_s:+s.end.toFixed(3)})):[];
        } else {
          row[b+"_perforazioni"]=c.on?(parseInt(c.perf,10)||0):0;
          row[b+"_number_semantics"]=semEff(i,r.key);
          row[b+"_distribution"]=c.dist||"AD_LIB";
          row[b+"_duration_s_stated"]=durS;
          const offS=c.off===""||c.off===undefined?null:(parseFloat(String(c.off).replace(",","."))||0);
          row[b+"_open_offset_s_stated"]=offS;
          row[b+"_approx"]=!!c.approx;
          if(durS!==null&&m.dur){
            const o=offS||0;
            row[b+"_open_start_fraction"]=+(o/m.dur).toFixed(3);
            row[b+"_open_end_fraction"]=+((o+durS)/m.dur).toFixed(3);
          } else { row[b+"_open_start_fraction"]=null; row[b+"_open_end_fraction"]=null; }
          const sm=scaleMatch(c.dur,c.approx);
          row[b+"_stated_matches_scale"]=sm?sm.lettera:null;
        }
        if(r.op===3) row[b+"_duration_s"]=durS;
        row[b+"_verify_flag"]=!!c.verify;
      });
      return row;
    }),
    eventi_cambio_testina:CONFINI.map(L=>{
      const inf=testinaInfo(L), ok=inf&&!inf.err;
      const idx=st.sezioni.findIndex(s=>s.lettera===L);
      return {separatore:(idx>0?st.sezioni[idx-1].lettera:"")+"|"+L,
        sezione_successiva:L,
        presente:!!ok,
        ritardo_secondi:ok?inf.r:null,
        coincide_con_separatore:ok?inf.r===0:null,
        periodo_derivato:ok?inf.periodo:null,
        frazione_nel_periodo:ok?+inf.frazione.toFixed(3):null,
        tempo_assoluto_secondi:ok?+inf.assoluto.toFixed(2):null};
    }),
    eventi_speciali_op3:st.eventi_op3.map(e=>({
      version:e.VERSION, cycle:e.CYCLE, period_span:e.PERIOD_SPAN||"",
      channel:e.CHANNEL, action_class:e.ACTION_CLASS, speed_profile:e.SPEED_PROFILE,
      count:e.indeterminate?null:(e.count===""||e.count===undefined?null:e.count),
      indeterminate:!!e.indeterminate,
      group_id:e.GROUP_ID===""||e.GROUP_ID===undefined?null:(parseInt(e.GROUP_ID,10)||null),
      duration_s:e.DURATION_S===""||e.DURATION_S===undefined?null:(parseFloat(String(e.DURATION_S).replace(",","."))||null),
      dynamics:e.DYNAMICS, notation_carrier:e.NOTATION_CARRIER||[], tn_ref:e.TN_REF,
      source_text:e.SOURCE_TEXT||"", verify_flag:!!e.VERIFY_FLAG
    })),
    operator_cards_derivate:cards()
  };
}
function dl(obj,name){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- init ---------- */
function paintAll(){
  document.getElementById("dauer").value=st.dauer;
  document.getElementById("rifv").value=st.rif_versione;
  document.getElementById("versione").value=st.versione;
  evSel=null; renderSezioni(); renderStatus(); buildGrid(); renderTestInfo(); renderPanel(); renderEventi(); renderDiag(); renderCards();
}

const vsel=document.getElementById("versione");
VERSIONI.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;vsel.appendChild(o)});
vsel.addEventListener("change",()=>{st=load(vsel.value);sel=0;paintAll();});
document.getElementById("dauer").addEventListener("input",e=>{st.dauer=e.target.value;renderStatus();renderDiag();save();});
document.getElementById("rifv").addEventListener("input",e=>{st.rif_versione=e.target.value;save();});
document.getElementById("btnExport").onclick=()=>dl(buildJson(),"formschema_versione_"+st.versione+".json");
document.getElementById("btnSave").onclick=()=>dl(st,"lavoro_versione_"+st.versione+".json");
document.getElementById("btnLoad").onclick=()=>document.getElementById("fileWork").click();
document.getElementById("btnReset").onclick=()=>{
  if(confirm("Azzerare tutti i dati della Versione "+st.versione+" e riportare ai valori di default? L'operazione non si pu\u00F2 annullare.")){
    st=fresh(st.versione); sel=0; evSel=null; paintAll(); save();
  }
};
document.getElementById("fileWork").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d&&d.periodi&&d.periodi.length===51&&d.periodi[0].op1L){st=migra(d);sel=0;evSel=null;paintAll();save();}
    else alert("Questo file non \u00E8 un lavoro salvato da qui. Usa il file di \u00AB Salva lavoro \u00BB.");
  }catch(err){alert("File non leggibile.")}};
  rd.readAsText(f); e.target.value="";
});
document.getElementById("btnImg").onclick=()=>document.getElementById("fileImg").click();
document.getElementById("fileImg").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=document.getElementById("scan");
  img.src=URL.createObjectURL(f); img.classList.remove("hide");
  document.getElementById("btnScan").textContent="NASCONDI SCANSIONE"; e.target.value="";
});
document.getElementById("btnScan").onclick=()=>{
  const img=document.getElementById("scan"); if(!img.src) return;
  const hidden=img.classList.toggle("hide");
  document.getElementById("btnScan").textContent=hidden?"MOSTRA SCANSIONE":"NASCONDI SCANSIONE";
};
document.getElementById("btnCards").onclick=()=>{
  cardsOpen=!cardsOpen;
  document.getElementById("cardsBody").classList.toggle("hide",!cardsOpen);
  document.getElementById("btnCards").textContent=(cardsOpen?"\u2212":"+")+" SCHEDE OPERATORE \u2014 CALCOLATE, NON DA TRASCRIVERE";
  renderCards();
};

st=load("I");
paintAll();
</script>
